name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser checks use full Chromium (playwright.config.js), so the headless shell is skipped.
      - run: npx playwright install --with-deps --no-shell chromium webkit
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
